[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete1"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "pytest",
    "tqdm",
]
authors = [
    {name = "Ben Whewell", email = "ben.whewell@pm.me"}
]
description = "1D Discrete Ordinates Multigroup Neutron Transport"
readme = "README.md"
license = "BSD-3-Clause"
keywords = ["neutron transport", "machine learning", "DJINN"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=discrete1 --cov-report=html --cov-report=xml"
testpaths = ["tests"]

[project.optional-dependencies]
ml = [
    "optuna",
    "scikit-learn>=1.4.0",
    "tensorboard",
    "djinnml",
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "pre-commit",
]
all = [
    "optuna",
    "scikit-learn>=1.4.0",
    "tensorboard",
    "djinnml",
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "pre-commit",
]
